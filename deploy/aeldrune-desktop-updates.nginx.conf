# Include inside the TLS server block for aeldrune.tibiadepot.com.
# The mutable feed must never be cached; versioned payloads are immutable.
location = /desktop-updates/latest.yml {
    alias /opt/aeldrune/shared/desktop-updates/latest.yml;
    default_type text/yaml;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ ^/desktop-updates/(Aeldrune-[0-9]+\.[0-9]+\.[0-9]+-win-x64\.(?:exe|exe\.blockmap|zip))$ {
    alias /opt/aeldrune/shared/desktop-updates/$1;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Do not expose directory listings or arbitrary files placed beside releases.
location /desktop-updates/ {
    return 404;
}
