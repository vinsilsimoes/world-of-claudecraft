name: Aeldrune Windows desktop publish

# One fail-closed pipeline for the Aeldrune alpha client. The explicit
# standalone build command pins the MIR4 gameplay profile, and the release
# verifier opens the packaged app.asar before any publication. Versioned
# artifacts move first on the update host; latest.yml moves last.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the Aeldrune alpha update feed'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aeldrune-windows-desktop-publish
  cancel-in-progress: false

jobs:
  windows:
    name: Build, prove, and optionally publish Aeldrune
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify version and release ancestry
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "package.json version: ${VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}." >&2
              exit 1
            fi
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Tag ${GITHUB_REF_NAME} is not on main; refusing to publish." >&2
              exit 1
            fi
          fi
          grep -qF "DESKTOP_VERSION = typeof __APP_VERSION__" src/game/desktop_download.ts
          grep -qF "__APP_VERSION__: JSON.stringify(appVersion)" vite.config.ts

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Electron packaging downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: ${{ runner.os }}-aeldrune-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aeldrune-electron-

      - name: Build the explicit Aeldrune Windows client
        run: npm run electron:build:aeldrune

      - name: Verify artifacts and packaged gameplay identity
        run: npm run electron:verify:aeldrune

      - name: Record alpha signing status
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release-aeldrune/Aeldrune-$version-win-x64.exe"
          $signature = Get-AuthenticodeSignature -FilePath $installer
          Write-Output "Authenticode status: $($signature.Status)"
          if ($signature.Status -ne 'Valid') {
            Write-Warning 'Alpha installer is unsigned. Configure code signing before a public release.'
          }

      - name: Attach verified Aeldrune artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aeldrune-windows-${{ github.ref_name }}
          retention-days: 7
          path: |
            release-aeldrune/Aeldrune-*-win-x64.exe
            release-aeldrune/Aeldrune-*-win-x64.exe.blockmap
            release-aeldrune/Aeldrune-*-win-x64.zip
            release-aeldrune/latest.yml

      - name: Publish atomically to the Aeldrune update feed
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          AELDRUNE_DESKTOP_SSH_HOST: ${{ secrets.AELDRUNE_DESKTOP_SSH_HOST }}
          AELDRUNE_DESKTOP_SSH_USER: ${{ secrets.AELDRUNE_DESKTOP_SSH_USER }}
          AELDRUNE_DESKTOP_SSH_PRIVATE_KEY: ${{ secrets.AELDRUNE_DESKTOP_SSH_PRIVATE_KEY }}
          AELDRUNE_DESKTOP_REMOTE_DIR: ${{ vars.AELDRUNE_DESKTOP_REMOTE_DIR }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AELDRUNE_DESKTOP_SSH_HOST)) {
            throw 'AELDRUNE_DESKTOP_SSH_HOST is not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:AELDRUNE_DESKTOP_SSH_PRIVATE_KEY)) {
            throw 'AELDRUNE_DESKTOP_SSH_PRIVATE_KEY is not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:AELDRUNE_DESKTOP_SSH_USER)) {
            $env:AELDRUNE_DESKTOP_SSH_USER = 'ubuntu'
          }
          if ([string]::IsNullOrWhiteSpace($env:AELDRUNE_DESKTOP_REMOTE_DIR)) {
            $env:AELDRUNE_DESKTOP_REMOTE_DIR = '/opt/aeldrune/shared/desktop-updates'
          }

          $identityPath = Join-Path $env:RUNNER_TEMP 'aeldrune-desktop.key'
          Set-Content -LiteralPath $identityPath -Value $env:AELDRUNE_DESKTOP_SSH_PRIVATE_KEY -NoNewline
          icacls $identityPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null
          $env:AELDRUNE_DESKTOP_SSH_IDENTITY = $identityPath
          try {
            node scripts/aeldrune-desktop-release.mjs publish
          } finally {
            Remove-Item -LiteralPath $identityPath -Force
          }
